# secretree's own source is public, so it can use hosted CI. Vaults created
# with it never should; see docs/vision.md, layer 4.
name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: go vet ./...
      - run: go test ./...
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the draft release
      id-token: write   # keyless cosign signing
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with: { args: release --clean }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the Homebrew cask
        # Needs a fine-grained token with Contents: read/write on
        # buildsnap-dev/homebrew-tap in the HOMEBREW_TAP_TOKEN secret.
        # A missing or wrong token fails only this step, not the release.
        continue-on-error: true
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -eu
          test -n "$HOMEBREW_TAP_TOKEN" || { echo "HOMEBREW_TAP_TOKEN not set; skipping"; exit 0; }
          test -f dist/homebrew/Casks/secretree.rb
          git clone --quiet "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/buildsnap-dev/homebrew-tap.git" tap
          mkdir -p tap/Casks && cp dist/homebrew/Casks/secretree.rb tap/Casks/secretree.rb
          cd tap
          git config user.name "secretree release bot" && git config user.email "noreply@secretree.dev"
          git add Casks/secretree.rb
          git commit -q -m "secretree ${GITHUB_REF_NAME#v}" || { echo "cask unchanged"; exit 0; }
          git push -q origin HEAD
